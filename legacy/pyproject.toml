[project]
name = "car-price-pipeline"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "dbt-duckdb==1.8.4",
  "duckdb>=0.10.0",
  "pydantic>=2.0.0",
  "streamlit>=1.30.0",
  "plotly>=5.0.0",
  "click>=8.0.0",
  "confluent-kafka[avro]>=2.3.0",
  "fastavro>=1.9.0",
  "minio>=7.2.0",
  "polars>=1.0.0",
  "snowplow-tracker>=1.1.0",
]

[project.optional-dependencies]
spark = [
  "pyspark==3.5.0",
  "delta-spark==3.2.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-mock>=3.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "spark: requires a local PySpark session (slow — needs JVM)",
    "integration: requires running external services (Kafka)",
    "slow: long running tests",
]

[tool.coverage.run]
source = ["src", "kafka", "dags"]
omit = ["*/tests/*", "*/_archive/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
