version: 2

sources:
  - name: gold
    description: "Gold layer produced by Databricks notebooks — aggregated business tables"
    tables:
      - name: price_by_brand
        description: "Average, median, min, max price per manufacturer (count >= 50)"
        columns:
          - name: manufacturer
            tests: [not_null, unique]
          - name: avg_price
            tests: [not_null]
          - name: count
            tests: [not_null]

      - name: price_by_year
        description: "Average price and count per model year"
        columns:
          - name: year
            tests: [not_null]
          - name: avg_price
            tests: [not_null]

      - name: price_by_condition
        description: "Average price per condition × manufacturer combination"
        columns:
          - name: condition
            tests: [not_null]
          - name: manufacturer
            tests: [not_null]
