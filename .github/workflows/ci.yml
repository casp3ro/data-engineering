name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dev deps
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src/ kafka/ dags/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dev deps
        run: uv sync --extra dev
      - name: Unit tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=src --cov=kafka --cov-report=term-missing
      - name: Coverage gate
        run: uv run coverage report --fail-under=70

  dbt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync
      - name: dbt parse
        run: cd dbt && uv run dbt parse --profiles-dir .
      - name: dbt compile
        run: cd dbt && uv run dbt compile --profiles-dir .

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync --extra dev
      - name: Spark tests
        run: uv run pytest tests/ -m spark -v
