name: car_price
version: "1.0.0"
config-version: 2
profile: car_price
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  min_price: 500
  max_price: 200000
  min_year: 1990
  max_year: 2024
  min_mileage: 0
  max_mileage: 500000
  top_makes_limit: 10

models:
  car_price:
    silver:
      +materialized: view
      +file_format: delta
    gold:
      +materialized: table
      +file_format: delta
      +location_root: s3a://gold
