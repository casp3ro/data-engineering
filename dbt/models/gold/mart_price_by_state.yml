version: 2

models:
  - name: mart_price_by_state
    description: "Median and average price per US state."
    columns:
      - name: state
        description: "Two-letter US state abbreviation (uppercase)."
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
                       'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
                       'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
                       'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
                       'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY']
      - name: listing_count
        description: "Number of listings in this state."
        tests: [not_null]
      - name: median_price
        description: "Median sale price in USD."
        tests: [not_null]
      - name: avg_price
        description: "Mean sale price in USD."
        tests: [not_null]
