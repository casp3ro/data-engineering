version: "3.8"

# Car Price Pipeline — local infra (Databricks edition)
# Databricks replaces Spark + MinIO for all compute.
# This compose runs: Kafka, Airflow, Streamlit dashboard.

networks:
  pipeline_net:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: Dockerfile.airflow
  networks: [pipeline_net]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    PYTHONPATH: /opt/airflow
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-car-listings}
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID}
    WAREHOUSE_PATH: /opt/airflow/data/warehouse.duckdb
    CAR_PRICE_CSV_PATH: /opt/airflow/data/raw/vehicles.csv
  volumes:
    - ../dags:/opt/airflow/dags
    - ../dbt:/opt/airflow/dbt
    - ../data:/opt/airflow/data
    - ../src:/opt/airflow/src
    - ../kafka:/opt/airflow/kafka
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Postgres (Airflow metadata DB) ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    networks: [pipeline_net]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # ── Airflow one-time DB migration ─────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin
          --firstname Admin --lastname User --role Admin
          --email admin@example.com || true
      "
    restart: "no"

  # ── Airflow webserver ─────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ─────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Zookeeper ─────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    networks: [pipeline_net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ── Kafka broker ──────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    networks: [pipeline_net]
    ports:
      - "9092:9092"
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10

  # ── Kafka UI ──────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks: [pipeline_net]
    ports:
      - "8085:8080"
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── Streamlit dashboard ───────────────────────────────────────────────
  streamlit:
    build:
      context: ..
      dockerfile: src/interfaces/dashboard/Dockerfile
    networks: [pipeline_net]
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    environment:
      WAREHOUSE_PATH: /app/data/warehouse.duckdb
