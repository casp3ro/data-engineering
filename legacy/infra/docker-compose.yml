version: "3.8"

# Car Price Pipeline — dual runtime
# Base: Kafka, Airflow, Streamlit
# Profile `local`: MinIO + Spark (batch/streaming + dbt against MinIO Delta)

networks:
  pipeline_net:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:
  minio_data:

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: Dockerfile.airflow
  env_file:
    - ../.env
  networks: [pipeline_net]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    PYTHONPATH: /opt/airflow
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-car-listings}
    DATABRICKS_HOST: ${DATABRICKS_HOST:-}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID:-}
    WAREHOUSE_PATH: /opt/airflow/data/warehouse.duckdb
    CAR_PRICE_CSV_PATH: /opt/airflow/data/raw/vehicles.csv
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
    MINIO_S3_ENDPOINT: http://minio:9000
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    PIPELINE_MODE: ${PIPELINE_MODE:-local}
    DBT_TARGET: ${DBT_TARGET:-local}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../dbt:/opt/airflow/dbt
    - ../data:/opt/airflow/data
    - ../src:/opt/airflow/src
    - ../kafka:/opt/airflow/kafka
    - ../scripts:/opt/airflow/scripts
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    networks: [pipeline_net]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin
          --firstname Admin --lastname User --role Admin
          --email admin@example.com || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__WEBSERVER__WORKERS: "2"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    networks: [pipeline_net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    networks: [pipeline_net]
    ports:
      - "9092:9092"
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks: [pipeline_net]
    ports:
      - "8085:8080"
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  streamlit:
    build:
      context: ..
      dockerfile: src/interfaces/dashboard/Dockerfile
    user: root
    networks: [pipeline_net]
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    environment:
      WAREHOUSE_PATH: /app/data/warehouse.duckdb

  # ── Local lakehouse (profile: local) ─────────────────────────────────
  minio:
    profiles: [local]
    image: minio/minio:latest
    networks: [pipeline_net]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5

  spark-master:
    profiles: [local]
    image: bitnami/spark:3.5.0
    networks: [pipeline_net]
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    profiles: [local]
    image: bitnami/spark:3.5.0
    networks: [pipeline_net]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    depends_on:
      - spark-master
